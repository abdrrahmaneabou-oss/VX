name: Build patched V2F APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout VX
        uses: actions/checkout@v4

      - name: Prepare stable base APK from prior artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input build/base
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/abdrrahmaneabou-oss/VX/actions/artifacts/11703717746/zip \
            -o build/base/base.zip
          unzip -o build/base/base.zip -d build/base
          BASE="$(find build/base -name '*.apk' | head -n1)"
          test -n "$BASE"
          cp "$BASE" input/V2F.apk
          unzip -t input/V2F.apk >/dev/null
          echo "Stable base APK: $(du -h input/V2F.apk | cut -f1)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl -fL --retry 3 \
            -o build/tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -jar build/tools/apktool.jar --version

      - name: Decode APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/decompiled
          java -jar build/tools/apktool.jar d -f input/V2F.apk -o build/decompiled

      - name: Inspect dynamic label integration points
        shell: bash
        run: |
          set -euo pipefail
          CFG="$(find build/decompiled -name 'SettingsClickGuardConfig.smali' | head -n1)"
          echo '===== SettingsClickGuardConfig ====='
          sed -n '1,280p' "$CFG"
          echo '===== blockedLabels references ====='
          grep -R -n -C 10 'blockedLabels' build/decompiled/smali* | head -n 600 || true
          echo '===== SettingsClickGuardConfig references ====='
          grep -R -n -C 8 'SettingsClickGuardConfig' build/decompiled/smali* | head -n 600 || true
          echo '===== MainActivity head ====='
          MAIN="$(find build/decompiled -name 'MainActivity.smali' | head -n1)"
          sed -n '1,320p' "$MAIN" || true
          echo '===== Activities in manifest ====='
          grep -n -C 3 '<activity' build/decompiled/AndroidManifest.xml | head -n 220 || true

      - name: Inspect lock screen UI implementation
        shell: bash
        run: |
          set -euo pipefail
          cat build/decompiled/smali_classes11/com/v1f/app/ui/screens/MeteorLockScreenKt.smali
          cat build/decompiled/smali_classes11/com/v1f/app/ui/screens/MeteorLockScreenKt\$\$ExternalSyntheticLambda0.smali
          cat build/decompiled/smali_classes11/com/v1f/app/ui/screens/MeteorLockScreenKt\$\$ExternalSyntheticLambda1.smali
          cat build/decompiled/smali_classes11/com/v1f/app/ui/screens/MeteorLockScreenKt\$\$ExternalSyntheticLambda2.smali
          cat build/decompiled/smali_classes11/com/v1f/app/ui/screens/MeteorLockScreenKt\$MeteorLockScreen\$1\$1.smali
          cat build/decompiled/smali_classes11/com/v1f/app/LockActivity.smali

      - name: Rebuild APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar build/tools/apktool.jar b build/decompiled -o build/V2F-unsigned.apk
          unzip -t build/V2F-unsigned.apk >/dev/null

      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/zipalign" -f -p 4 build/V2F-unsigned.apk build/V2F-aligned.apk

      - name: Prepare signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore build/signing.jks \
            -storepass android \
            -keypass android \
            -alias v2f-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=V2F CI,O=VX,C=US'

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/apksigner" sign \
            --ks build/signing.jks \
            --ks-key-alias v2f-ci \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/V2F-patched.apk \
            build/V2F-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose build/V2F-patched.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 build/V2F-patched.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V2F-dynamic-work
          path: build/V2F-patched.apk
          if-no-files-found: error
          retention-days: 30
