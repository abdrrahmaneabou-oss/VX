name: Build patched V2F APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/V2F.apk'
      - 'tools/patch_settings_guard.py'
      - 'tools/patch_break_interval.py'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout VX
        uses: actions/checkout@v4

      - name: Prepare base APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          if [ ! -f input/V2F.apk ]; then
            echo 'Downloading original V2F.apk from temporary signed source...'
            curl -fL --retry 5 --retry-delay 2 \
              'https://sdmntprnortheu.oaiusercontent.com/files/00000000-b2d4-81f4-af6f-ca952f79c5a6/raw?se=2026-10-13T03%3A36%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=5aafb1de-ab27-5cb3-9505-cb07a0ea6d4c&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T00%3A15%3A52Z&ske=2026-10-14T00%3A15%3A52Z&sks=b&skv=2026-02-06&sig=2vILUhXM3yL8x1uj2sBknrWqTyN4H0ZwwtIbnFFW9Tw%3D' \
              -o input/V2F.apk
          fi
          test "$(sha256sum input/V2F.apk | awk '{print $1}')" = 'e66d7650dfcd98962206faca33d37d7bc464958fd865a9af2149bcb65e268134'
          unzip -t input/V2F.apk >/dev/null
          echo "Base APK verified: $(du -h input/V2F.apk | cut -f1)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl -fL --retry 3 \
            -o build/tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -jar build/tools/apktool.jar --version

      - name: Decode APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/decompiled
          java -jar build/tools/apktool.jar d -f input/V2F.apk -o build/decompiled

      - name: Inspect dynamic label integration points
        shell: bash
        run: |
          set -euo pipefail
          CFG="$(find build/decompiled -name 'SettingsClickGuardConfig.smali' | head -n1)"
          echo '===== SettingsClickGuardConfig ====='
          sed -n '1,260p' "$CFG"
          echo '===== blockedLabels references ====='
          grep -R -n -C 8 'blockedLabels' build/decompiled/smali* | head -n 500 || true
          echo '===== SettingsClickGuardConfig references ====='
          grep -R -n -C 6 'SettingsClickGuardConfig' build/decompiled/smali* | head -n 500 || true
          echo '===== MainActivity head ====='
          MAIN="$(find build/decompiled -name 'MainActivity.smali' | head -n1)"
          sed -n '1,260p' "$MAIN" || true
          echo '===== Activities in manifest ====='
          grep -n -C 2 '<activity' build/decompiled/AndroidManifest.xml | head -n 200 || true

      - name: Patch SettingsClickGuardConfig
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_settings_guard.py build/decompiled

      - name: Patch automatic break interval to 12 hours
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_break_interval.py build/decompiled

      - name: Rebuild APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar build/tools/apktool.jar b build/decompiled -o build/V2F-unsigned.apk
          unzip -t build/V2F-unsigned.apk >/dev/null

      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/build-tools"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "Using Android build tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" version

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/zipalign" -f -p 4 build/V2F-unsigned.apk build/V2F-aligned.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 build/V2F-aligned.apk

      - name: Prepare signing key
        shell: bash
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${APK_KEYSTORE_B64:-}" ]; then
            printf '%s' "$APK_KEYSTORE_B64" | base64 -d > build/signing.jks
            echo "KS_ALIAS=${APK_KEY_ALIAS:?Set APK_KEY_ALIAS secret}" >> "$GITHUB_ENV"
            echo "KS_PASS=${APK_KEYSTORE_PASSWORD:?Set APK_KEYSTORE_PASSWORD secret}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${APK_KEY_PASSWORD:?Set APK_KEY_PASSWORD secret}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore build/signing.jks \
              -storepass android \
              -keypass android \
              -alias v2f-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=V2F CI,O=VX,C=US'
            echo 'KS_ALIAS=v2f-ci' >> "$GITHUB_ENV"
            echo 'KS_PASS=android' >> "$GITHUB_ENV"
            echo 'KEY_PASS=android' >> "$GITHUB_ENV"
          fi

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/apksigner" sign \
            --ks build/signing.jks \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/V2F-patched.apk \
            build/V2F-aligned.apk

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t build/V2F-patched.apk >/dev/null
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/V2F-patched.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 build/V2F-patched.apk
          sha256sum build/V2F-patched.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V2F-patched-12h
          path: build/V2F-patched.apk
          if-no-files-found: error
          retention-days: 30
