name: Inspect V2F original Compose UI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-original-ui.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare base and decode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/base build/tools
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/abdrrahmaneabou-oss/VX/actions/artifacts/11703717746/zip -o build/base/base.zip
          unzip -o build/base/base.zip -d build/base
          cp "$(find build/base -name '*.apk' | head -n1)" build/base.apk
          curl -fL -o build/tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -jar build/tools/apktool.jar d -f build/base.apk -o build/decompiled
          echo '==== V1FScreen ===='
          cat "$(find build/decompiled -name V1FScreen.smali | head -n1)" | head -n 240
          echo '==== App UI state navigation ===='
          f=$(find build/decompiled -name 'V1FAppKt$V1FApp$2$1$2.smali' | head -n1)
          grep -n -E 'V1FScreen|HomeScreen|Duration|AppSelection|WebsiteSelection|invoke\(' "$f" | head -n 130 || true
          echo '==== App UI lambda field state ===='
          f=$(find build/decompiled -name 'V1FAppKt$V1FApp$2$1.smali' | head -n1)
          grep -n -E 'V1FScreen|MutableState|setValue|HomeScreen|Duration|Selection' "$f" | head -n 110 || true
          exit 0
          echo '==== Accessibility service complete event method ===='
          f=$(find build/decompiled -name 'AppBlockAccessibilityService.smali' | head -n1)
          sed -n '/^.method public onAccessibilityEvent(/,/^.end method/p' "$f" | head -n 250
          echo '==== Lock method ===='
          sed -n '/^.method private final showApplicationLock(/,/^.end method/p' "$f" | head -n 150
          echo '==== RememberedApps selected methods ===='
          f=$(find build/decompiled -name 'RememberedApps.smali' | head -n1)
          grep -n -E '^.method|\.field' "$f" | head -n 100
          echo '==== RememberedApps class ===='
          f=$(find build/decompiled -name 'RememberedApps.smali' | head -n1); echo "$f"; cat "$f" | head -n 280
          echo '==== Selection screen remembered load context ===='
          f=$(find build/decompiled -name 'AppSelectionScreenKt.smali' | head -n1); sed -n '665,755p' "$f"; sed -n '6750,6800p' "$f"
          echo '==== AppGraph init ===='
          f=$(find build/decompiled -name 'AppGraph.smali' | head -n1); sed -n '/^.method public final initialize(/,/^.end method/p' "$f" | head -n 210
          echo '==== Selection screen method identifiers ===='
          for n in AppSelectionScreenKt WebsiteSelectionScreenKt; do f=$(find build/decompiled -name "$n.smali" | head -n1); echo "$n"; grep -n -E '^.method|SharedPreferences|selected|Selected|startSession|toggle|Set;' "$f" | head -n 130; done
          echo '==== app selection prefs references ===='
          grep -R -n -E 'v1f_selected|selected_packages|selected_apps|blocked_packages|app_selection' build/decompiled/smali_classes*/com/v1f/app | head -n 90 || true
          echo '==== SessionRepository selection methods ===='
          f=$(find build/decompiled -name 'SessionRepository.smali' | head -n1); grep -n -E '^.method|\.field' "$f" | head -n 140
          echo '==== SessionRepository constructor and selected getters ===='
          sed -n '/^.method public constructor <init>/,/^.end method/p' "$f" | head -n 110
          echo '==== InstalledApp model ===='
          f=$(find build/decompiled -name 'InstalledApp.smali' | head -n1); grep -n -E '^.method|\.field' "$f" | head -n 90
          echo '==== App selection references ===='
          grep -n -E 'SessionRepository;->|InstalledAppsRepository;->' build/decompiled/smali_classes11/com/v1f/app/ui/screens/AppSelectionScreenKt.smali | head -n 80 || true
          echo '==== Website repository constructor ===='
          f=$(find build/decompiled -name 'BlockedSitesRepository.smali' | head -n1); sed -n '/^.method public constructor <init>/,/^.end method/p' "$f" | head -n 80
          echo '==== Exact repository methods ===='
          for n in BlockedAppsRepository BlockedSitesRepository InstalledAppsRepository AppGraph; do f=$(find build/decompiled -name "$n.smali" | head -n1); echo "$f"; test -z "$f" || grep -n -E '^.method|\.field' "$f" | head -n 125; done
          echo '==== App selection toggles ===='
          grep -R -n 'BlockedAppsRepository;->' build/decompiled/smali_classes*/com/v1f/app/ui/screens/AppSelectionScreenKt* 2>/dev/null | head -n 55
          echo '==== Website selection toggles ===='
          grep -R -n 'BlockedSitesRepository;->' build/decompiled/smali_classes*/com/v1f/app/ui/screens/WebsiteSelectionScreenKt* 2>/dev/null | head -n 55
          echo '==== Exact repository constructors ===='
          for n in BlockedAppsRepository BlockedSitesRepository; do f=$(find build/decompiled -name "$n.smali" | head -n1); test -z "$f" || sed -n '/^.method public constructor <init>/,/^.end method/p' "$f" | head -n 100; done
          echo '==== App/site repository candidates ===='
          find build/decompiled -path '*com/v1f/app*' -name '*.smali' | grep -Ei '(AppRepository|Website|SiteRepository|Domain|BlockedApp|BlockedSite|AppSelection|WebsiteSelection|Selection|Preferences)' | head -n 100
          echo '==== App/site repository methods ===='
          for f in $(find build/decompiled -path '*com/v1f/app*' -name '*.smali' | grep -Ei '(AppRepository|WebsiteRepository|SiteRepository|DomainRepository|AppSelection|WebsiteSelection)' | head -n 12); do echo "$f"; grep -n -E '^.method|\.field' "$f" | head -n 110; done
          echo '==== Site and app data store references ===='
          grep -R -n -E 'getBlockedApps|getBlockedSites|getSelectedApps|getSelectedSites|setBlockedApps|setBlockedSites|addBlocked|selectedApps|selectedSites' build/decompiled/smali_classes*/com/v1f/app/{data,model,ui} 2>/dev/null | head -n 95
          echo '==== Session model fields and getters ===='
          find build/decompiled -path '*/com/v1f/app/model/*Session*.smali' -print | head -n 15
          grep -R -n -E 'getEndsAt|getStart|endsAt|durationMillis|durationMinutes' build/decompiled/smali_classes*/com/v1f/app/model/*Session* 2>/dev/null | head -n 100
          echo '==== BreakRuntime and BreakRules ===='
          for f in $(find build/decompiled -name 'BreakRuntime.smali' -o -name 'BreakRules.smali'); do echo "$f"; grep -n -E '^.method|\.field|Session|elapsed|end|start|allowsAll' "$f" | head -n 120; done
          echo '==== Accessibility event method ===='
          sed -n '/^.method public onAccessibilityEvent(/,/^.end method/p' build/decompiled/smali_classes*/com/v1f/app/service/AppBlockAccessibilityService.smali | head -n 180
          echo '==== HomeScreen button sites ===='
          grep -R -n -B 35 -A 20 'CompactGlassButtonKt;->CompactGlassButton\|CelestialButtonKt;->CelestialButton' build/decompiled/smali_classes11/com/v1f/app/ui/screens/HomeScreen* | head -n 330 || true
          echo '==== Native insertion context ===='
          TARGET="$(find build/decompiled -name 'HomeScreenKt$HomeScreen$3$1$8.smali' | head -n1)"
          sed -n '360,630p' "$TARGET"
          echo '==== Accessibility service methods ===='
          grep -n -E '^.method|Block|Session|onAccessibilityEvent' build/decompiled/smali_classes*/com/v1f/app/service/AppBlockAccessibilityService.smali | head -n 130
          echo '==== StrictBlockPolicy ===='
          cat tools/dynamic/StrictBlockPolicy.java | head -n 160
          echo '==== Session classes ===='
          find build/decompiled -name '*Session*.smali' | grep 'com/v1f/app' | head -n 55
          echo '==== Readiness logic ===='
          sed -n '/^.method public final getAllReady()/,/^.end method/p' build/decompiled/smali_classes9/com/v1f/app/model/PermissionSnapshot.smali
          sed -n '/^.method public final getCompletedCount()/,/^.end method/p' build/decompiled/smali_classes9/com/v1f/app/model/PermissionSnapshot.smali
          echo '==== Readiness usage ===='
          grep -R -n 'PermissionSnapshot;->getAllReady' build/decompiled/smali_classes*/com/v1f/app 2>/dev/null | head -n 85
          echo '==== PermissionSnapshot model ===='
          cat build/decompiled/smali_classes9/com/v1f/app/model/PermissionSnapshot.smali | head -n 320
          echo '==== PermissionRepository key methods ===='
          grep -n -E '^.method|PermissionSnapshot;->|DevicePolicyManager|Accessibility' build/decompiled/smali_classes10/com/v1f/app/data/PermissionRepository.smali | head -n 180
          echo '==== Screen gates ===='
          grep -R -n 'PermissionSnapshot;->' build/decompiled/smali_classes{7,9,10,11}/com/v1f/app 2>/dev/null | head -n 125
          echo '==== Permission gating references ===='
          grep -R -n -E 'DeviceAdminManager;->|DevicePolicyManager;->isAdminActive|isAccessibilityServiceEnabled|isAccessibilityEnabled|allPermissionsGranted|allPermissions|permissionCount|PermissionStatus|hasAllPermissions' build/decompiled/smali_classes11/com/v1f/app 2>/dev/null | head -n 180 || true
          echo '==== Permission classes ===='
          find build/decompiled -iname '*Permission*.smali' -o -iname '*Setup*.smali' | head -n 85
          echo '==== MainActivity methods ===='
          MAIN="$(find build/decompiled -name MainActivity.smali | head -n1)"
          grep -nE '^\.method|setContent|Composable|attachStatus|DynamicLabelsEntry' "$MAIN" | head -n 120
          echo '==== MainActivity content lambda names ===='
          find build/decompiled -name 'MainActivity*.smali' | head -n 35
          echo '==== UI entry references ===='
          grep -R -l 'V1FMainScreen\|MainScreen\|HomeScreen\|Celestial' build/decompiled/smali_classes*/*/v1f/app 2>/dev/null | head -n 45 || true
          echo '==== MainActivity complete ===='
          cat "$MAIN"
          echo '==== HomeScreen methods and UI call sites ===='
          HOME="$(find build/decompiled -name HomeScreenKt.smali | head -n1)"
          grep -nE '^\\.method|CelestialButton|Scaffold|Column|Button|Text' "$HOME" | head -n 160
          echo '==== HomeScreen composable method beginning ===='
          sed -n '/^.method public static final HomeScreen(/,/^.end method/p' "$HOME" | head -n 100 || true
          echo '==== V1FApp layout ===='
          APP="$(find build/decompiled -name 'V1FAppKt.smali' | head -n1)"
          grep -nE '^.method|HomeScreen|Scaffold|NavHost' "$APP" | head -n 110
          echo '==== Compose singleton root ===='
          SING="$(find build/decompiled -name 'ComposableSingletons*MainActivityKt.smali' | head -n1)"
          test -z "$SING" || grep -nE 'HomeScreen|V1FApp|\\.method' "$SING" | head -n 90
