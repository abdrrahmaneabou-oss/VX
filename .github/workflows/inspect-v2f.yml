name: Inspect V2F accessibility bytecode
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-v2f.yml'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract original accessibility bytecode
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/base build/tools build/decompiled inspect
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/abdrrahmaneabou-oss/VX/actions/artifacts/11703717746/zip -o build/base/base.zip
          unzip -o build/base/base.zip -d build/base
          cp "$(find build/base -name '*.apk' | head -n1)" build/original.apk
          curl -fL --retry 3 -o build/tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -jar build/tools/apktool.jar d -f -r build/original.apk -o build/decompiled
          find build/decompiled -name '*.smali' | grep -E 'AppBlockAccessibilityService|SettingsEscapeGuard|SettingsClickDetector|SettingsClickGuard|ProtectionEngine|SettingsGuard|LockActivity' | while read -r f; do
            mkdir -p "inspect/$(dirname "$f")"
            cp "$f" "inspect/$f"
          done
          grep -Rn -E 'performGlobalAction\(|->performGlobalAction|SettingsClickDetector;->detect|SettingsEscapeGuard;|GLOBAL_ACTION_BACK|->performBack' build/decompiled --include='*.smali' | head -n 120 > inspect/hook_locations.txt || true
          echo "Extracted files:"
          find inspect -type f | head -n 60
      - uses: actions/upload-artifact@v4
        with:
          name: v2f-accessibility-bytecode
          path: inspect
          retention-days: 3
