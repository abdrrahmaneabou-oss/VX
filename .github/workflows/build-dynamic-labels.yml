name: Build V2F configurable break interval

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/dynamic/**'
      - 'tools/patch_dynamic_labels.py'
      - 'tools/patch_dynamic_guard.py'
      - 'tools/patch_break_interval_dynamic.py'
      - 'tools/build_dynamic_dex.sh'
      - 'tools/package_dynamic.py'
      - 'tools/build_dynamic_apk.sh'
      - '.github/workflows/build-dynamic-labels.yml'

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare base APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input build/base
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/abdrrahmaneabou-oss/VX/actions/artifacts/11703717746/zip -o build/base/base.zip
          unzip -o build/base/base.zip -d build/base
          cp "$(find build/base -name '*.apk' | head -n1)" input/V2F.apk
          unzip -t input/V2F.apk >/dev/null

      - name: Build configurable interval APK
        id: configurable_build
        continue-on-error: true
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          bash tools/build_dynamic_apk.sh input/V2F.apk build/V2F-configurable-break.apk 2>&1 | tee build/configurable-build.log

      - name: Report build failure
        if: steps.configurable_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Failed run $GITHUB_RUN_ID"
            echo
            echo '```text'
            tail -n 220 build/configurable-build.log
            echo '```'
          } > /tmp/v2f-build-diagnostic.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v2f-build-diagnostic.md
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.configurable_build.outcome == 'success'
        with:
          name: V2F-configurable-break
          path: build/V2F-configurable-break.apk
          if-no-files-found: error
          retention-days: 30
